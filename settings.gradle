pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.spongepowered.gradle.vanilla') {
                useModule('org.spongepowered:vanillagradle:0.2.1-20221107.002437-50')
            }
        }
    }
}

rootProject.name = 'Boss Rifts'
include("Common", "Fabric", "Forge")